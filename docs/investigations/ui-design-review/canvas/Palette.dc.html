<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #5b88f7; } a:hover { color: #8fb0fa; }
    .cl { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  </style>
</helmet>

<div style="width: 760px; height: 640px; display: flex; align-items: flex-start; justify-content: center; padding-top: 44px; box-sizing: border-box; background: #0c0e10; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="width: 560px; display: flex; flex-direction: column; border-radius: 10px; background: #1e2227; border: 1px solid rgba(242,244,238,0.19); box-shadow: 0 18px 48px rgba(0,0,0,0.62); overflow: hidden;">

    <!-- one shell header, 44px -->
    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid rgba(242,244,238,0.11);">
      <div style="color: #5b88f7; display: flex;">
        <sc-if value="{{isCommand}}" hint-placeholder-val="{{ true }}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.6" y="5.6" width="4.8" height="4.8"/><circle cx="4.1" cy="4.1" r="1.5"/><circle cx="11.9" cy="4.1" r="1.5"/><circle cx="4.1" cy="11.9" r="1.5"/><circle cx="11.9" cy="11.9" r="1.5"/></svg>
        </sc-if>
        <sc-if value="{{isQuickOpen}}" hint-placeholder-val="{{ false }}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.2 2.6h4.6L12 5.8v7.6H4.2z"/><path d="M8.6 2.6v3.3H12"/></svg>
        </sc-if>
      </div>
      <span style="font-size: 13px; font-weight: 600; color: #f1f3ef;">{{shellTitle}}</span>
      <span style="font-size: 10px; color: #55605a;">{{shellHint}}</span>
      <div style="flex: 1;"></div>
      <span class="cl" style="font-size: 9px; font-weight: 600; color: #707871; background: #181b1f; border: 1px solid rgba(242,244,238,0.11); border-radius: 3px; padding: 2px 6px;">esc</span>
    </div>

    <!-- input, 40px -->
    <div style="padding: 10px 12px 8px 12px;">
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 11px; border-radius: 5px; background: #121416; border: 1px solid rgba(91,136,247,0.55);">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#707871" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.1"/><path d="M10.1 10.1 13.6 13.6"/></svg>
        <span style="font-size: 13px; color: #f1f3ef;">{{queryText}}</span>
        <span style="width: 1px; height: 16px; background: #5b88f7;"></span>
        <div style="flex: 1;"></div>
        <span style="font-size: 10px; color: #55605a;">{{countText}}</span>
      </div>
    </div>

    <!-- results -->
    <div style="padding: 0 8px 8px 8px; min-height: 322px;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
        <div onClick="{{row.pick}}" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; margin-bottom: 2px; border-radius: 5px; background: {{row.bg}}; box-shadow: {{row.ring}}; cursor: pointer;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{row.dot}}; flex-shrink: 0;"></span>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">
            <span style="font-size: 12px; font-weight: 500; color: {{row.fg}}; white-space: nowrap;">{{row.title}}</span>
            <span class="cl" style="font-size: 9px; color: #55605a; white-space: nowrap;">{{row.id}}</span>
          </div>
          <span style="font-size: 9px; font-weight: 700; color: {{row.dot}}; background: {{row.riskBg}}; border-radius: 3px; padding: 2px 6px; white-space: nowrap;">{{row.risk}}</span>
          <span class="cl" style="font-size: 10px; font-weight: 600; color: {{row.keyFg}}; white-space: nowrap; min-width: 52px; text-align: right;">{{row.shortcut}}</span>
        </div>
      </sc-for>
    </div>

    <!-- footer -->
    <div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #181b1f; border-top: 1px solid rgba(242,244,238,0.11);">
      <div onClick="{{moveUp}}" style="display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; background: #121416; border: 1px solid rgba(242,244,238,0.11); cursor: pointer;">
        <span class="cl" style="font-size: 10px; color: #c9cec8;">↑</span>
        <span style="font-size: 10px; color: #707871;">前へ</span>
      </div>
      <div onClick="{{moveDown}}" style="display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; background: #121416; border: 1px solid rgba(242,244,238,0.11); cursor: pointer;">
        <span class="cl" style="font-size: 10px; color: #c9cec8;">↓</span>
        <span style="font-size: 10px; color: #707871;">次へ</span>
      </div>
      <span style="width: 1px; height: 14px; background: rgba(242,244,238,0.11);"></span>
      <span style="font-size: 10px; color: #707871;"><span class="cl" style="color: #c9cec8;">↵</span> 選択中を実行</span>
      <div style="flex: 1;"></div>
      <span style="font-size: 10px; color: #55605a;">{{footerNote}}</span>
    </div>
  </div>
</div>

<script data-dc-script data-props='{"variant":{"editor":"enum","options":["command","quickOpen"],"default":"command","section":"Mode"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 2 };
  }

  catalog(variant) {
    if (variant === 'quickOpen') {
      return [
        { title: 'ProjectPaneLayoutView.swift', id: 'apple/ClairApp/ProjectWorkspace.swift', shortcut: '', risk: '最近', dot: '#5b88f7', riskBg: 'rgba(91,136,247,0.14)' },
        { title: 'PaneSplit.swift', id: 'apple/ClairApp/PaneSplit.swift', shortcut: '', risk: '最近', dot: '#5b88f7', riskBg: 'rgba(91,136,247,0.14)' },
        { title: 'ProjectPaneNode.swift', id: 'apple/ClairApp/ProjectModel.swift', shortcut: '', risk: '', dot: '#707871', riskBg: 'transparent' },
        { title: 'PaneLayoutTests.swift', id: 'apple/ClairTests/ProjectKernelTests.swift', shortcut: '', risk: '', dot: '#707871', riskBg: 'transparent' },
        { title: 'pane-layout.md', id: 'docs/architecture/pane-layout.md', shortcut: '', risk: '', dot: '#707871', riskBg: 'transparent' },
        { title: 'WorkspaceChrome.swift', id: 'apple/ClairApp/WorkspaceChrome.swift', shortcut: '', risk: '', dot: '#707871', riskBg: 'transparent' }
      ];
    }
    return [
      { title: 'ペインを右に分割', id: 'clair.pane.split.horizontal', shortcut: '⌃⌘D', risk: '追加', dot: '#8acb94', riskBg: 'rgba(138,203,148,0.14)' },
      { title: 'ペインを下に分割', id: 'clair.pane.split.vertical', shortcut: '⌃⌘⇧D', risk: '追加', dot: '#8acb94', riskBg: 'rgba(138,203,148,0.14)' },
      { title: 'ペインのフォーカスを右へ', id: 'clair.pane.focus.right', shortcut: '⌃⌘→', risk: '読み取り', dot: '#9ba19b', riskBg: 'rgba(155,161,155,0.12)' },
      { title: 'ペインを最大化', id: 'clair.pane.maximize', shortcut: '⌃⌘M', risk: '読み取り', dot: '#9ba19b', riskBg: 'rgba(155,161,155,0.12)' },
      { title: '分割を均等化', id: 'clair.pane.equalize', shortcut: '⌃⌘=', risk: '読み取り', dot: '#9ba19b', riskBg: 'rgba(155,161,155,0.12)' },
      { title: 'ペインを閉じる', id: 'clair.pane.close', shortcut: '⌃⌘W', risk: '破壊的', dot: '#e27b83', riskBg: 'rgba(226,123,131,0.14)' }
    ];
  }

  renderVals() {
    var variant = this.props.variant || 'command';
    var isCommand = variant === 'command';
    var all = this.catalog(variant);
    var index = Math.max(0, Math.min(this.state.index, all.length - 1));
    var self = this;

    var rows = all.map(function (row, i) {
      var on = i === index;
      return {
        title: row.title,
        id: row.id,
        shortcut: row.shortcut,
        risk: row.risk,
        dot: row.dot,
        riskBg: row.riskBg,
        bg: on ? '#2b333c' : 'transparent',
        ring: on ? 'inset 0 0 0 1px rgba(91,136,247,0.55)' : 'none',
        fg: on ? '#f1f3ef' : '#c9cec8',
        keyFg: on ? '#c9cec8' : '#55605a',
        pick: function () { self.setState({ index: i }); }
      };
    });

    return {
      rows: rows,
      isCommand: isCommand,
      isQuickOpen: !isCommand,
      shellTitle: isCommand ? 'コマンド' : 'ファイルへ移動',
      shellHint: isCommand ? 'Command Registryの全操作' : 'Project内のファイル',
      queryText: isCommand ? 'pane' : 'panelay',
      countText: all.length + ' 件',
      footerNote: isCommand ? '⌘K' : '⌘P',
      moveUp: function () { self.setState({ index: Math.max(0, index - 1) }); },
      moveDown: function () { self.setState({ index: Math.min(all.length - 1, index + 1) }); }
    };
  }
}
</script>
</body>
</html>
