name: Release

# Publishes Clair to the public Diwamoto/clair-releases mirror when a push to master changes VERSION
# (docs/runbooks/release.md). The work lives in scripts/release.sh so any other CI can run it too.
on:
  push:
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write # push the v<VERSION> tag to this repository

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Self-hosted Apple Silicon Mac: free for private repos, and libghostty (zig + Metal toolchain)
    # stays vendored between runs instead of being rebuilt on every hosted runner.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          clean: false # keep the vendored libghostty and SwiftPM caches (both gitignored)

      - name: Vendor libghostty
        run: |
          [[ -f packages/ClairCore/Vendor/ghostty/GhosttyKit.xcframework/Info.plist ]] || ./scripts/ghostty.sh vendor

      - name: Test
        run: make test

      - name: Build, sign and publish
        env:
          CLAIR_UPDATE_PRIVATE_KEY: ${{ secrets.CLAIR_UPDATE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: ./scripts/release.sh
