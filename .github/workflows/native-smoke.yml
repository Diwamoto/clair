name: Native smoke

on:
  pull_request:
  push:
    branches: ["**"] # not v* tags: the same commit already ran on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run native workspace checks
        run: make ci
